<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Games | GenBharat</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:wght@600;700&display=swap" rel="stylesheet">
<link rel="icon" href="favicon.png"><link rel="stylesheet" href="styles.css"></head><body>
<div class="top"><div class="w"><span id="dt"></span><span>Opinion and analysis from a nationalist viewpoint</span></div></div>
<div class="mast"><div class="w"><a class="brand" href="index.html"><img src="logo.png" alt="" width="52" height="52"><span data-name></span></a><nav><a href="index.html">Home</a><a href="editorials.html">Editorials</a><a href="index.html#power">Power map</a><a href="index.html#india">India since 2014</a><a class="on" href="games.html">Games</a><a href="connect.html">Connect</a></nav></div></div>
<main class="w"><div class="sh" style="margin-top:36px"><h2>Games</h2><p>Play the map, test your instincts on policy, or run a state for five years. Some games carry our editorial view, and say so.</p></div>
<div class="tbs" id="tabs"></div><div class="qz" id="stage" style="max-width:760px;margin-bottom:56px"></div></main>
<footer><div class="w"><p><span data-name></span> &middot; <a data-email></a> &middot; <a data-insta target="_blank" rel="noopener"></a></p><p style="margin-top:8px">Editorials and columns express the views of their authors.</p></div></footer>
<script src="app.js"></script>
<script src="states.js"></script><script>
const sh=a=>a.map(v=>[Math.random(),v]).sort((p,q)=>p[0]-q[0]).map(v=>v[1]);
const NM={sweep:'Saffron Sweep',years:'Years in power',freebie:'Freebie or foundation',run:'Run the state',gov:'Who governs?',myth:'Fact or myth'};
const tabs=$('tabs'),stage=$('stage');
tabs.innerHTML=Object.keys(NM).map(k=>`<button class="tb" data-k="${k}">${NM[k]}</button>`).join('');
tabs.onclick=e=>{const k=e.target.dataset.k;if(!k)return;[...tabs.children].forEach(b=>b.classList.toggle('on',b===e.target));clearInterval(window._t);stage.innerHTML='';G[k](stage)};
function again(el,f,msg){el.insertAdjacentHTML('beforeend',`<p class="ex">${msg||''}</p><button class="bt" id="a">Play again</button>`);$('a').onclick=()=>f(el)}
function sweep(el){const B=S.filter(s=>s[2]==='BJP').length;let found=0,t=30,over=false;
el.innerHTML=`<h3>Saffron Sweep</h3><p class="ex">Find every state with a BJP government in 30 seconds. A wrong tap costs 2 seconds and reveals the state's real colour.</p><p><b id="sc">0</b> of ${B} found &nbsp; <b id="tm">30</b>s</p><div class="g10" id="grid"></div><div id="res"></div>`;
const end=()=>{over=true;clearInterval(window._t);again($("res"),()=>sweep(el),found===B?`All ${B} found with ${t} seconds to spare.`:`Time up. You found ${found} of ${B}.`)};
S.forEach(s=>{const b=document.createElement('button');b.className='t';b.style.cssText=`grid-column:${s[6]+1};grid-row:${s[7]+1};background:#334155;color:#fff`;b.textContent=s[0];b.title=s[1];
b.onclick=()=>{if(over||b.dataset.d)return;b.dataset.d=1;if(s[2]==='BJP'){found++;b.style.background=P.BJP[1];b.style.color='#0F172A'}else{t=Math.max(0,t-2);b.style.background=P[s[2]][1];b.style.color='#0F172A'}$('sc').textContent=found;$('tm').textContent=t;if(found===B)end()};$('grid').appendChild(b)});
window._t=setInterval(()=>{t--;$('tm').textContent=Math.max(t,0);if(t<=0)end()},1000)}
const Y=[['The Left Front in West Bengal (1977 to 2011)',34],['Naveen Patnaik\'s BJD in Odisha (2000 to 2024)',24],['The Left Front in Tripura (1993 to 2018)',25],['The SDF in Sikkim (1994 to 2019)',24],['AAP in Delhi (2015 to 2025)',10],['The TMC in West Bengal (2011 to 2026)',15],['The LDF in Kerala (2016 to 2026)',10],['The BJP in Assam (2016 to 2026)',10],['The BJP in Gujarat (continuous from 1998)',28]];
function years(el){const Q=sh(Y).slice(0,6);let i=0,tot=0;(function r(){if(i>=Q.length){el.innerHTML=`<h3>Total: ${tot} of ${Q.length*100}</h3>`;again(el,years,tot>=450?'You know your political history.':'Study the map and try again.');return}
const[l,v]=Q[i];el.innerHTML=`<h3>Years in power</h3><p class="note">Round ${i+1} of ${Q.length}. How long did this run last?</p><p style="font-size:1.1rem;margin:8px 0">${l}</p><label class="sl">Your guess: <b id="gv">20</b> years<input type="range" id="sl" min="0" max="40" value="20"></label><button class="bt" id="ok">Lock in</button><p class="ex" id="fb"></p>`;
$('sl').oninput=()=>$('gv').textContent=$('sl').value;
$('ok').onclick=()=>{const g=+$('sl').value,p=Math.max(0,100-6*Math.abs(g-v));tot+=p;$('sl').disabled=true;$('fb').innerHTML=`Actual: <b>${v} years</b>. You scored ${p}.`;$('ok').outerHTML=`<button class="bt" id="nx">${i+1<Q.length?'Next':'Finish'}</button>`;$('nx').onclick=()=>{i++;r()}}})()}
const FF=[['Free electricity for every household, whatever the income','F','a recurring bill the state pays forever, and no asset is created.'],['A new expressway linking two industrial regions','B','roads cut costs for every business for decades.'],['Free laptops or TV sets handed out before an election','F','a one-time gift that builds no lasting capacity.'],['Piped water to rural homes under Jal Jeevan','B','a lasting asset that also saves women hours of fetching water.'],['A blanket loan waiver for all farmers','F','it clears old debt without fixing irrigation or prices, and invites the next waiver.'],['Upgrading ITIs with modern machines and industry tie-ups','B','skills raise lifetime earnings.'],['Toilets in every village under Swachh Bharat','B','a permanent sanitation asset.'],['Free bus travel for all passengers on all routes','F','it needs an annual subsidy and strains fleet upkeep, though supporters point to the mobility it gives women.']];
function freebie(el){const Q=sh(FF);let i=0,ag=0;(function r(){if(i>=Q.length){el.innerHTML=`<h3>You agreed with our editors on ${ag} of ${Q.length}</h3>`;again(el,freebie,'Our test: does the money build something that keeps paying back, or must it be refilled every year? Every party runs welfare schemes, and supporters of recurring transfers argue they cut poverty and lift demand. Judge for yourself.');return}
const[t,a,why]=Q[i];el.innerHTML=`<h3>Freebie or foundation?</h3><p class="note">${i+1} of ${Q.length}. Sort it the way you see it, then see our view.</p><p style="font-size:1.1rem;margin:8px 0 14px">${t}</p><button class="op" data-a="F">Freebie: a recurring giveaway</button><button class="op" data-a="B">Foundation: builds lasting capacity</button><div id="fb"></div>`;
el.querySelectorAll('.op').forEach(b=>b.onclick=()=>{el.querySelectorAll('.op').forEach(x=>{x.disabled=true;if(x.dataset.a===a)x.classList.add('ok')});if(b.dataset.a===a)ag++;else b.classList.add('no');$('fb').innerHTML=`<p class="ex">Our view: ${why}</p><button class="bt" id="nx">${i+1<Q.length?'Next':'Finish'}</button>`;$('nx').onclick=()=>{i++;r()}})})()}
function run(el){const K=[['infra','Roads, rail and power'],['ind','Industry and investment'],['law','Policing and law and order'],['wel','Welfare subsidies'],['edu','Schools and health']];
el.innerHTML=`<h3>Run the state</h3><p class="ex">You are Chief Minister for five years. Share exactly 100 budget points. A point spent in one place is not spent elsewhere. This is a simple model that reflects our editorial view, not a forecast.</p>`+K.map(([k,n])=>`<label class="sl">${n}: <b id="v_${k}">20</b><input type="range" id="${k}" min="0" max="50" value="20"></label>`).join('')+`<p>Left to spend: <b id="left">0</b></p><button class="bt" id="go">Run five years</button><div id="out"></div>`;
const v=k=>+$(k).value,tot=()=>K.reduce((a,[k])=>a+v(k),0);
K.forEach(([k])=>$(k).oninput=()=>{$('v_'+k).textContent=v(k);$('left').textContent=100-tot()});
$('go').onclick=()=>{if(tot()!==100){$('out').innerHTML=`<p class="ex">Spend exactly 100 points. You are at ${tot()}.</p>`;return}
const f=x=>Math.sqrt(x/50),i=f(v('infra')),n=f(v('ind')),l=f(v('law')),w=f(v('wel')),e=f(v('edu')),
M=[['Growth',.5*i+.4*n+.1*e],['Jobs',.6*n+.2*i+.2*e],['Safety',l],['Welfare reach',.7*w+.3*e],['Fiscal health',Math.max(0,1-Math.max(0,v('wel')-25)/25)]],
s=[...M].sort((a,b)=>b[1]-a[1]),vd=v('wel')>35?'Heavy subsidies left little to build with and pushed up debt.':v('infra')+v('ind')>=50?'An investment-led strategy: growth and jobs lead, in our reading.':'A balanced budget, with no single engine of growth.';
$('out').innerHTML=M.map(([a,b])=>`<div class="row" style="padding:8px 0"><b>${a}</b> ${Math.round(b*100)}%<div class="bar"><i style="width:${Math.round(b*100)}%;background:var(--ac)"></i></div></div>`).join('')+`<p class="ex">Strongest: ${s[0][0]}. Weakest: ${s[4][0]}. ${vd}</p><p class="ex">Reasonable people weigh these trade-offs differently, and critics argue welfare spending pays for itself in demand and health.</p>`}}
function mcq(el,qs){let i=0,sc=0;(function r(){if(i>=qs.length){el.innerHTML=`<h3>Score: ${sc} of ${qs.length}</h3>`;again(el,x=>mcq(x,qs.map(q=>q)));return}
const[q,o,a,x]=qs[i];el.innerHTML=`<div class="pg"><i style="width:${i/qs.length*100}%"></i></div><h3>${q}</h3>`+o.map((t,k)=>`<button class="op" data-k="${k}">${t}</button>`).join('')+'<div id="fb"></div>';
el.querySelectorAll('.op').forEach(b=>b.onclick=()=>{const k=+b.dataset.k;el.querySelectorAll('.op').forEach(y=>{y.disabled=true;if(+y.dataset.k===a)y.classList.add('ok')});if(k===a)sc++;else b.classList.add('no');$('fb').innerHTML=`<p class="ex">${k===a?'Correct. ':'Not quite. '}${x}</p><button class="bt" id="nx">${i+1<qs.length?'Next':'Finish'}</button>`;$('nx').onclick=()=>{i++;r()}})})()}
const keys=Object.keys(P).filter(k=>k!=='OTH').map(k=>P[k][0]);
function gov(el){mcq(el,sh(S.filter(s=>s[2]!=='OTH')).slice(0,10).map(s=>{const rt=P[s[2]][0],o=sh([rt,...sh(keys.filter(k=>k!==rt)).slice(0,3)]);return[`Which party leads the government in <b>${s[1]}</b>?`,o,o.indexOf(rt),`${s[1]}: ${s[3]}, ${s[4]} of ${s[5]} seats.`]}))}
const T=[['UPI was launched in 2016.',1,'NPCI launched UPI in April 2016.'],['The Lok Sabha has 545 elected seats.',0,'It has 543 elected seats.'],['GST replaced the old indirect taxes in 2014.',0,'GST came into effect on 1 July 2017.'],['Article 21 protects life and personal liberty.',1,'Correct.'],['The Constitution came into force on 15 August 1947.',0,'It came into force on 26 January 1950.'],['In the 2026 Tamil Nadu election, TVK won a single-party majority.',0,'TVK won 108 of 234 seats and formed a government with support from others.'],['Chandrayaan-3 landed near the Moon\'s south pole.',1,'It did, on 23 August 2023.']];
function myth(el){mcq(el,sh(T).map(([q,t,x])=>[q,['True','False'],t?0:1,x]))}
const G={sweep,years,freebie,run,gov,myth};tabs.firstChild.click();</script></body></html>
